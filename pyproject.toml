[project]
name = "retail-data-pipeline"
version = "1.0.0"
description = "End-to-end batch data pipeline: CSV -> PostgreSQL raw -> staging -> marts, with data-quality gates"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
