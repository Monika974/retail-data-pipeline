name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: retail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeline" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@localhost:5432/retail_test
      DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@localhost:5432/retail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: End-to-end smoke run
        run: python -m pipeline.run all --orders 2000
